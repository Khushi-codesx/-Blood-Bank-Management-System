{% extends 'base.html' %}{% block content %}<div class="container"><h2>Available Blood Stock</h2><table><tr><th>Blood Group</th><th>Units</th><th>Blood Bank</th><th>Address</th></tr>{% for s in stocks %}<tr><td>{{ s.bloodgroup }}</td><td>{{ s.units }}</td><td>{{ s.bankname }}</td><td>{{ s.address }}</td></tr>{% empty %}<tr><td colspan="4">No stock available.</td></tr>{% endfor %}</table></div>{% endblock %}
