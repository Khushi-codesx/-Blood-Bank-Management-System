{% extends 'base.html' %}{% block content %}<div class="container"><form method="post" class="form">
{% comment %} <h2>Feedback</h2> {% endcomment %}
<h2 class="text-center text-danger mb-4">*Always welcome supporters*</h2>
{% csrf_token %}<label>Name</label><input name="name" required>
<label>Phone</label>

<input type="text" name="phone" maxlength="10" required
       pattern="^\d{10}$"
       oninput="validatePhone(this)">
       
<script>
function validatePhone(input) {
    let value = input.value;

    // Agar non-digit hai
    if (/[^0-9]/.test(value)) {
        input.setCustomValidity("Only numbers are allowed");
    }
    // Agar digits hain but 10 se kam ya zyada
    else if (value.length !== 10) {
        input.setCustomValidity("Please enter 10 digit number");
    }
    else {
        input.setCustomValidity("");
    }
}
</script>

<label>Email</label><input type="email" name="email"><label>Rating</label><select name="rating"><option></option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Comments</label><textarea name="comments" required></textarea><button class="btn">Submit</button></form></div>{% endblock %}
