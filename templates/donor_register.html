{% extends 'base.html' %}

{% block content %}

{% comment %} <div class="container-fluid d-flex justify-content-center align-items-center" {% endcomment %}
<div class="container-fluid d-flex justify-content-center align-items-center p-0"
     style="min-height: calc(100vh - 70px); font-family: Arial;margin-left:570px; margin-top:20px;">
  

    <div class="card shadow p-4" style="width: 580px; border-radius: 12px;">

        <h2 class="text-center text-danger mb-4">
         Donar Registration
        </h2>

        <form method="post">
            {% csrf_token %}

            <label class="form-label">Full Name</label>
            <input name="fullname" class="form-control mb-3" required>

            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control mb-3" required>

            <label class="form-label">Phone</label>
            <input type="text" name="phone" maxlength="10"
                   class="form-control mb-3"
                   pattern="^\d{10}$"
                   oninput="validatePhone(this)" required>

            <label class="form-label">Gender</label>
            <select name="gender" class="form-select mb-3">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control mb-3" required>

            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control mb-3" required>

            <button class="btn btn-danger w-100">
                Register
            </button>

        </form>

        <p class="text-center mt-3 mb-0">
            Already registered?
            {% comment %} <a href="{% url 'donar_login' %}"  {% endcomment %}
           <a href=" {% url 'donor_login' %}"
            class="text-danger fw-bold">
                Login
            </a>
        </p>

    </div>

</div>

<script>
function validatePhone(input) {
    let value = input.value;

    if (/[^0-9]/.test(value)) {
        input.setCustomValidity("Only numbers are allowed");
    }
    else if (value.length !== 10) {
        input.setCustomValidity("Please enter 10 digit number");
    }
    else {
        input.setCustomValidity("");
    }
}
</script>

{% endblock %}
