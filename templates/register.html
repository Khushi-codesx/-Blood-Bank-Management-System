{% extends 'base.html' %}{% block content %}<div class="container"><form method="post" class="form"><h2>Admin Registration</h2>{% csrf_token %}<label>Full Name</label><input name="fullname" required><label>Email</label><input type="email" name="email" required>
<label>Phone</label>

<input type="text" name="phone" maxlength="10" required
       pattern="^\d{10}$"
       oninput="validatePhone(this)">
       
<script>
function validatePhone(input) {
    let value = input.value;

    // Agar non-digit hai
    if (/[^0-9]/.test(value)) {
        input.setCustomValidity("Only numbers are allowed");
    }
    // Agar digits hain but 10 se kam ya zyada
    else if (value.length !== 10) {
        input.setCustomValidity("Please enter 10 digit number");
    }
    else {
        input.setCustomValidity("");
    }
}
</script>
<label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select><label>Password</label><input type="password" name="password" required><label>Confirm Password</label><input type="password" name="confirm_password" required><button class="btn">Register</button><p>Already registered? <a href="{% url 'admin_login' %}">Login</a></p></form></div>{% endblock %}
